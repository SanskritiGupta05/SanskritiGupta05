<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 210" width="490" height="210" role="img" aria-label="Inkwork Press">
<defs><filter id="paper" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/>
  <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 .07 0"/>
</filter><clipPath id="cc"><rect width="490" height="210" rx="16"/></clipPath></defs>
<g clip-path="url(#cc)"><rect width="490" height="210" fill="#FBF8F2"/><rect width="490" height="210" filter="url(#paper)"/>
<style>.spin{transform-origin:395px 105px;animation:spin linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-origin:395px 105px;animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.12)}}</style>
<circle cx="395" cy="105" r="70" fill="none" stroke="#1B1A18" stroke-width="2" stroke-dasharray="2 6" class="spin" style="animation-duration:30s;animation-direction:normal"/><circle cx="395" cy="105" r="58" fill="none" stroke="#1B1A18" stroke-width="6" stroke-dasharray="10 6" class="spin" style="animation-duration:24s;animation-direction:reverse"/><circle cx="395" cy="105" r="46" fill="none" stroke="#1B1A18" stroke-width="1.5" stroke-dasharray="1 4" class="spin" style="animation-duration:18s;animation-direction:normal"/><circle class="pulse" cx="395" cy="105" r="28" fill="#C8322B"/>

<circle class="sun" cx="190" cy="170" r="36"/>
<ellipse class="petal" cx="640" cy="-10" rx="5" ry="3"/>
<ellipse class="petal" cx="820" cy="-10" rx="4" ry="2.5" style="animation-delay:3s"/>
<ellipse class="petal" cx="520" cy="-10" rx="3.5" ry="2" style="animation-delay:6s"/>
<g class="fade" style="animation-delay:.6s"><text x="380" y="96" style="font:600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:3px;fill:#6B645A">CS GRADUATE  →  PRODUCT DESIGNER  →  VIBE CODER</text></g>
<g class="fade" style="animation-delay:.9s"><text x="376" y="168" style="font:400 64px Georgia, 'Times New Roman', serif;fill:#1B1A18;letter-spacing:-1px">Sanskriti Gupta</text></g>
<g class="fade" style="animation-delay:1.2s"><text x="380" y="210" style="font:italic 400 22px Georgia, 'Times New Roman', serif;fill:#6B645A">a product designer who codes her own ideas.</text></g>
<line x1="380" y1="232" x2="440" y2="232" stroke="#C8322B" stroke-width="2" class="fade" style="animation-delay:1.4s"/>
<text class="role" style="animation-delay:0s" x="380" y="262">→ designing in Figma</text><text class="role" style="animation-delay:3s" x="380" y="262">→ vibe coding with Claude Code</text><text class="role" style="animation-delay:6s" x="380" y="262">→ shipping on Vercel</text><text class="role" style="animation-delay:9s" x="380" y="262">→ sketching on paper</text>
<g class="stamp"><rect x="872" y="240" width="56" height="56" rx="8" fill="#C8322B"/>
<text x="900" y="279" text-anchor="middle" style="font:700 30px Georgia, 'Times New Roman', serif;fill:#F3EDE2">創</text></g>
<text x="952" y="70" class="jp">デ</text><text x="952" y="96" class="jp">ザ</text><text x="952" y="122" class="jp">イ</text><text x="952" y="148" class="jp">ン</text><text x="952" y="174" class="jp">と</text><text x="952" y="200" class="jp">コ</text><text x="952" y="226" class="jp">ー</text><text x="952" y="252" class="jp">ド</text>
</g>
<rect x=".5" y=".5" width="999" height="339" rx="20" fill="none" stroke="#DDD3C3"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Sanskriti Gupta, product designer who codes her own ideas">
<defs><filter id="paper" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/>
  <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 .07 0"/>
</filter>
<radialGradient id="g"><stop offset="0" stop-color="#F2C9A0" stop-opacity=".35"/><stop offset="1" stop-color="#F2C9A0" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="1000" height="340" rx="20"/></clipPath></defs>
<style>
.enso{fill:none;stroke:#1B1A18;stroke-linecap:round;stroke-dasharray:800;stroke-dashoffset:800;animation:draw 2.2s cubic-bezier(.6,.05,.3,1) .2s forwards}
.enso2{animation-duration:2.6s;animation-delay:.35s}
@keyframes draw{to{stroke-dashoffset:0}}
.sun{fill:#C8322B;transform-origin:190px 170px;transform:scale(0);animation:pop .9s cubic-bezier(.3,1.6,.5,1) 1.9s forwards}
@keyframes pop{to{transform:scale(1)}}
.glow{opacity:.4;transform-origin:190px 170px;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{opacity:1;transform:scale(1.08)}}
.fade{opacity:0;animation:in .8s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.role{font:500 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#C8322B;opacity:0;animation:cycle 12s infinite}
@keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-8px)}}
.stamp{transform-origin:900px 268px;opacity:0;animation:stamp .5s cubic-bezier(.3,1.5,.5,1) 2.6s forwards}
@keyframes stamp{from{opacity:0;transform:rotate(-8deg) scale(1.6)}to{opacity:.92;transform:rotate(-8deg) scale(1)}}
.jp{font:14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#6B645A;text-anchor:middle}
.petal{fill:#C8322B;opacity:0;animation:fall 9s linear infinite}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:.7}90%{opacity:.5}100%{opacity:0;transform:translate(-120px,260px) rotate(220deg)}}
</style>
<g clip-path="url(#c)">
<rect width="1000" height="340" fill="#F3EDE2"/>
<rect width="1000" height="340" filter="url(#paper)"/>


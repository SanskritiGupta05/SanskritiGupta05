<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 210" width="490" height="210" role="img" aria-label="Sanskriti — Portfolio">
<defs><filter id="paper" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/>
  <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 .07 0"/>
</filter><clipPath id="cc"><rect width="490" height="210" rx="16"/></clipPath></defs>
<g clip-path="url(#cc)"><rect width="490" height="210" fill="#FBF8F2"/><rect width="490" height="210" filter="url(#paper)"/>
<style>.sway{transform-origin:395px 20px;animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.lg{animation:breathe 3s ease-in-out infinite}@keyframes breathe{50%{opacity:.35}}</style>
<g class="sway"><line x1="395" y1="20" x2="395" y2="58" stroke="#1B1A18" stroke-width="2"/>
<circle class="lg" cx="395" cy="110" r="62" fill="#F2C9A0" opacity=".18"/>

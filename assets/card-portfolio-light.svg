<text x="26" y="112" style="font:400 14.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#6B645A">Washi paper by day, lantern light</text><text x="26" y="133" style="font:400 14.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#6B645A">by night. Pull the lantern to switch.</text><rect x="26" y="164" width="66" height="24" rx="12" fill="none" stroke="#DDD3C3"/><text x="59" y="180" text-anchor="middle" style="font:500 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6B645A">Next.js</text><rect x="100.4" y="164" width="88" height="24" rx="12" fill="none" stroke="#DDD3C3"/><text x="144" y="180" text-anchor="middle" style="font:500 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6B645A">TypeScript</text><rect x="196.4" y="164" width="52" height="24" rx="12" fill="none" stroke="#DDD3C3"/><text x="222" y="180" text-anchor="middle" style="font:500 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6B645A">Figma</text>

<circle cx="27" cy="96" r="5" fill="#E34C26"/><text x="38" y="100" style="font:400 11.5px 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#7D8B99">HTML</text>

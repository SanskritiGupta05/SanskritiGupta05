<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 220" width="490" height="220" role="img" aria-label="Inkwork Press">
<defs>
<linearGradient id="grad" x1="0" x2="1"><stop offset="0" stop-color="#39D0D8"/><stop offset="1" stop-color="#A371F7"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#16212D" stroke-width="1"/></pattern>
<clipPath id="frame"><rect width="490" height="220" rx="12"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="490" height="220" fill="#0B0F14"/><rect width="490" height="220" fill="url(#grid)" opacity=".6"/>
<rect width="490" height="30" fill="#151E2A"/>
<text x="16" y="20" style="font:500 11.5px 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#7D8B99"><tspan fill="#3FB950">~/</tspan>inkwork-press</text>
<text x="474" y="20" text-anchor="end" style="font:500 11.5px 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#7D8B99">↗</text>
<style>.spin{transform-origin:400px 118px;animation:spin linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>
<circle cx="400" cy="118" r="64" fill="none" stroke="#39D0D8" stroke-width="1.5" stroke-dasharray="2 6" class="spin" style="animation-duration:30s;animation-direction:normal"/><circle cx="400" cy="118" r="52" fill="none" stroke="#A371F7" stroke-width="4" stroke-dasharray="10 6" class="spin" style="animation-duration:22s;animation-direction:reverse"/><circle cx="400" cy="118" r="40" fill="none" stroke="#39D0D8" stroke-width="1.5" stroke-dasharray="1 4" class="spin" style="animation-duration:16s;animation-direction:normal"/><circle cx="400" cy="118" r="22" fill="#F778BA"><animate attributeName="r" values="22;26;22" dur="3s" repeatCount="indefinite"/></circle>
